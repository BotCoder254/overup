[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
aws-sdk-s3 = "1"
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
# Hosted-runner provisioning via the Docker Engine API; `ssl` (rustls)
# enables remote TLS daemons, mirroring the runner crate.
bollard = { version = "0.21", features = ["ssl"] }
dashmap = "6"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
flate2 = "1"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = "9"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "macros",
] }
thiserror = "2"
time = "0.3"
protocol = { path = "../protocol" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "cors",
    "trace",
    "limit",
    "request-id",
    "util",
] }
tower_governor = "0.8"
tracing = "0.1"
unicode-general-category = "1"
unicode-normalization = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
validator = { version = "0.20", features = ["derive"] }
# Wipes plaintext runner bootstrap tokens from memory as soon as they have
# been injected into a container environment.
zeroize = "1"
