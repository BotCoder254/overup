name: CI

# Compile + test gate for the whole monorepo: the React/TypeScript frontend
# and the three sibling Rust crates (protocol, backend, runner). Every job is
# self-contained — no database, no secrets, no external services — because the
# backend uses runtime sqlx queries (no compile-time `query!` macros), so the
# control plane builds and unit-tests without a live PostgreSQL.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# One in-flight run per ref: a new push cancels the previous run's jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # --- Frontend: React + TypeScript (create-react-app) ----------------------
  frontend:
    name: frontend (typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # --legacy-peer-deps mirrors the Vercel/Netlify install and sidesteps the
      # React 19 peer-dependency conflicts across the UI stack.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Test
        run: npx react-scripts test --watchAll=false --passWithNoTests
        env:
          CI: true

      # CI=false so create-react-app does not promote lint warnings to build
      # errors — matches the production build on Vercel/Netlify.
      - name: Build
        run: npm run build
        env:
          CI: false

  # --- Rust crates: protocol, backend, runner (edition 2024) ----------------
  rust:
    name: rust
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [protocol, backend, runner]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Per-crate cache keyed on each crate's own Cargo.lock (no shared
      # workspace) so the three builds don't clobber each other's cache.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Build
        run: cargo build --locked --verbose

      - name: Test
        run: cargo test --locked --verbose
